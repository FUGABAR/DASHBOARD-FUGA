<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Eventos Fuga</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Red+Hat+Display:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="appStyle">
:root{
  --bg:#FFF9EA;
  --surface:#FFFFFF;
  --surface-2:#F3ECD6;
  --border:#E4D9BB;
  --text:#000000;
  --text-muted:#6B6250;
  --accent:#F45720;
  --accent-ink:#FFFFFF;
  --accent-soft:#FBDCC9;
  --partner:#273067;
  --partner-soft:#DCE1F0;
  --good:#17382C;
  --good-soft:#D9E7DE;
  --warn:#93590A;
  --warn-soft:#F7E4BE;
  --bad:#B7301E;
  --bad-soft:#F6D9D2;
  --info:#273067;
  --info-soft:#DCE1F0;
  --shadow:0 1px 2px rgba(20,20,30,.06),0 8px 24px -12px rgba(20,20,30,.22);
  --radius:10px;
  --font-display:'Bebas Neue','Arial Narrow',sans-serif;
  --font-body:'Red Hat Display',-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0C;
    --surface:#1A1A1A;
    --surface-2:#242320;
    --border:#333029;
    --text:#FFF9EA;
    --text-muted:#A69C82;
    --accent:#FF6B3D;
    --accent-ink:#1A0800;
    --accent-soft:#3D2013;
    --partner:#7C89D9;
    --partner-soft:#1E2440;
    --good:#3FAE7C;
    --good-soft:#123526;
    --warn:#E3A53B;
    --warn-soft:#3A2A10;
    --bad:#E15B4C;
    --bad-soft:#3A1712;
    --info:#7C89D9;
    --info-soft:#1E2440;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0C;
  --surface:#1A1A1A;
  --surface-2:#242320;
  --border:#333029;
  --text:#FFF9EA;
  --text-muted:#A69C82;
  --accent:#FF6B3D;
  --accent-ink:#1A0800;
  --accent-soft:#3D2013;
  --partner:#7C89D9;
  --partner-soft:#1E2440;
  --good:#3FAE7C;
  --good-soft:#123526;
  --warn:#E3A53B;
  --warn-soft:#3A2A10;
  --bad:#E15B4C;
  --bad-soft:#3A1712;
  --info:#7C89D9;
  --info-soft:#1E2440;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text-muted);
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
input,select,textarea{
  font-family:inherit;font-size:13px;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:6px;padding:6px 8px;
}
textarea{resize:vertical;min-height:36px}
.money-field{
  display:inline-flex;align-items:center;gap:3px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);padding-left:8px;
}
.money-field .money-prefix{font-size:12px;font-weight:700;color:var(--text-muted);flex:none}
.money-field input{border:none;background:transparent;padding:6px 6px 6px 0;width:90px;min-width:0}
.money-field input:focus-visible{outline:none}
.money-field:focus-within{outline:2px solid var(--accent);outline-offset:2px}
::placeholder{color:var(--text-muted);opacity:.8}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{height:36px;width:auto;display:block;flex:none}
.brand h1{font-size:28px;letter-spacing:-.01em}
.topbar p{margin:2px 0 0;color:var(--text-muted);font-size:13px}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.refresh-bar{display:inline-flex}
.refresh-bar .btn{color:var(--text-muted)}
.refresh-bar .btn:hover{color:var(--text)}
.btn{
  display:inline-flex;align-items:center;gap:6px;border-radius:7px;border:1px solid transparent;
  padding:9px 14px;font-size:13px;font-weight:600;line-height:1;transition:filter .12s,background .12s;
}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:transparent;color:var(--bad);border-color:transparent;padding:6px 8px}
.btn-danger:hover{background:var(--bad-soft)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon{width:14px;height:14px;flex:none;display:block}

/* ---- banners / toast ---- */
.banner{
  display:flex;align-items:center;gap:8px;background:var(--warn-soft);color:var(--warn);
  border:1px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;margin-bottom:16px;
}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- avisos / alerts ---- */
.alerts-panel{
  display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);overflow:hidden;margin-bottom:20px;max-height:340px;overflow-y:auto;
}
.alerts-panel.empty{max-height:none}
.alerts-empty{display:flex;align-items:center;gap:8px;padding:16px 18px;font-size:13px;color:var(--good);font-weight:600}
.alert-row{
  display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--border);
  border-left:4px solid var(--border);
}
.alert-row:last-child{border-bottom:none}
.alert-row.overdue{border-left-color:var(--bad);background:var(--bad-soft)}
.alert-row.soon{border-left-color:var(--warn)}
.alert-row.upcoming{border-left-color:var(--border)}
.alert-main{flex:1;min-width:0}
.alert-title{font-weight:700;font-size:13.5px}
.alert-sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-top:2px}
.alert-event-link{
  background:none;border:none;padding:0;font:inherit;color:var(--text);font-weight:600;text-decoration:underline;
  text-decoration-color:var(--border);cursor:pointer;
}
.alert-event-link:hover{text-decoration-color:var(--text)}
.alert-due{font-size:12px;font-weight:700;white-space:nowrap;color:var(--text-muted)}
.alert-due.overdue{color:var(--bad)}
.alert-due.soon{color:var(--warn)}

.avisos-group{border-bottom:1px solid var(--border)}
.avisos-group:last-child{border-bottom:none}
.avisos-group-head{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;
  background:var(--surface-2);border:none;cursor:pointer;font:inherit;text-align:left;color:var(--text);
}
.avisos-group-head:hover{background:var(--border)}
.avisos-chevron{display:inline-flex;transition:transform .15s;flex-shrink:0;color:var(--text-muted)}
.avisos-chevron.open{transform:rotate(90deg)}
.avisos-group-name{font-weight:700;font-size:13.5px;flex:1}
.avisos-group-count{font-size:12px;color:var(--text-muted);white-space:nowrap}
.avisos-group-overdue{color:var(--bad);font-weight:700}
.avisos-group-body{display:flex;flex-direction:column}
.avisos-group-body .alert-row:last-child{border-bottom:none}

/* ---- stat tiles ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;display:flex;flex-direction:column;gap:4px;
}
.stat .n{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1}
.stat .n.bad{color:var(--bad)}
.stat .l{font-size:12px;color:var(--text-muted);font-weight:600}
.stat .sub{font-size:12px;color:var(--text-muted)}

/* ---- filter bar ---- */
.filterbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.filterbar input[type=search]{min-width:220px}
.filterbar .spacer{flex:1}
.count-pill{font-family:var(--font-mono);font-size:12px;color:var(--text-muted)}

/* ---- table ---- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th{
  text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);
  font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.row-clickable{cursor:pointer;transition:background .1s}
tbody tr.row-clickable:hover{background:var(--surface-2)}
.event-name{font-weight:700;color:var(--text)}
.event-sub{color:var(--text-muted);font-size:12px;margin-top:1px}

/* ---- pills / badges ---- */
.pill{
  display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:3px 9px;
  font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.4;
}
.pill-planejamento{background:var(--surface-2);color:var(--text-muted)}
.pill-confirmado{background:var(--info-soft);color:var(--info)}
.pill-em_andamento{background:var(--warn-soft);color:var(--warn)}
.pill-concluido{background:var(--good-soft);color:var(--good)}
.pill-cancelado{background:var(--surface-2);color:var(--text-muted);text-decoration:line-through}
.pill-fuga{background:var(--accent-soft);color:var(--accent)}
.pill-parceiro{background:var(--partner-soft);color:var(--partner)}
.pill-compartilhado{background:var(--surface-2);color:var(--text-muted)}
.pill-collab{background:var(--partner-soft);color:var(--partner)}
.pill-proprio{background:var(--surface-2);color:var(--text-muted)}
.pill-alert{background:var(--bad-soft);color:var(--bad)}

/* ---- progress ---- */
.progress-cell{display:flex;align-items:center;gap:8px;min-width:120px}
.progress-track{flex:1;height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden}
.progress-fill{height:100%;background:var(--good);border-radius:100px}
.progress-frac{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);white-space:nowrap}

/* ---- empty state ---- */
.empty{padding:64px 24px;text-align:center;color:var(--text-muted)}
.empty h3{color:var(--text);font-size:20px;margin-bottom:6px}
.empty p{margin:0 0 16px;font-size:13px}

/* ---- detail view ---- */
.back-link{
  display:inline-flex;align-items:center;gap:5px;color:var(--text-muted);font-size:12.5px;font-weight:600;
  background:none;border:none;padding:0;margin-bottom:14px;
}
.back-link:hover{color:var(--text)}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.detail-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail-collapse-btn{
  display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;
  border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text-muted);cursor:pointer;
}
.detail-collapse-btn:hover{border-color:var(--accent);color:var(--accent)}
.title-input{
  font-family:var(--font-display);font-size:26px;font-weight:700;border:1px solid transparent;background:transparent;
  padding:2px 6px;border-radius:6px;min-width:220px;
}
.title-input:hover,.title-input:focus{border-color:var(--border);background:var(--surface)}
.field-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}
.field.span2{grid-column:span 2}
.field.span4{grid-column:span 4}

.section{margin-bottom:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:10px}
.section-head h2{font-size:18px}
.section-head .hint{font-size:12px;color:var(--text-muted)}
.section-head-left{display:flex;align-items:center;gap:8px}

.progress-summary{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.progress-summary .progress-track{max-width:280px}

.add-row{display:flex;gap:8px;align-items:flex-end;padding:12px 14px;background:var(--surface-2);border-top:1px solid var(--border);flex-wrap:wrap}
.add-row .field{min-width:130px}
.add-row .field.grow{flex:1;min-width:160px}

td input,td select,td textarea{width:100%;min-width:96px;border-color:transparent;background:transparent}
td input:hover,td select:hover,td textarea:hover{border-color:var(--border)}
td input:focus,td select:focus,td textarea:focus{border-color:var(--accent);background:var(--surface)}
td.col-obs textarea{min-width:140px}
td.col-status select,td.col-lado select{font-weight:700}
.alert-flag{display:inline-flex;align-items:center;gap:4px;color:var(--bad);font-size:11px;font-weight:700}
.alert-flag.warn{color:var(--warn)}

/* ---- modal ---- */
dialog{
  border:none;border-radius:12px;padding:0;background:var(--surface);color:var(--text);
  box-shadow:var(--shadow);width:min(480px,92vw);
}
dialog::backdrop{background:rgba(10,10,14,.5)}
.modal-body{padding:22px}
.modal-body h2{font-size:20px;margin-bottom:16px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}

/* ---- quick nav ---- */
.quicknav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.quicknav a{
  font-size:12px;font-weight:700;color:var(--text-muted);text-decoration:none;background:var(--surface-2);
  border-radius:100px;padding:5px 12px;
}
.quicknav a:hover{color:var(--text);background:var(--border)}

/* ---- mapa do evento ---- */
.map-layout{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.map-preview{flex:1 1 380px;min-width:280px;position:sticky;top:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px}
.map-preview-name{font-size:13px;font-weight:700;margin-bottom:8px}
.map-svg-wrap{width:100%;aspect-ratio:10/7.2;border-radius:8px;overflow:hidden;background:var(--surface)}
.map-svg-wrap svg{width:100%;height:100%;display:block}
.map-list{flex:1 1 220px;min-width:200px;display:flex;flex-direction:column;gap:6px}
.map-list-item{
  display:block;width:100%;text-align:left;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);padding:9px 12px;font-size:12.5px;font-weight:600;
  cursor:pointer;transition:background .12s,border-color .12s,color .12s;
}
.map-list-item:hover{border-color:var(--accent)}
.map-list-item.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.map-list-item .n{opacity:.55;font-weight:700;margin-right:6px}
.map-list-empty{font-size:12px;color:var(--text-muted)}

/* ---- financeiro ---- */
.fin-inputs{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.fin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.fin-bars{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.fin-bar-row{display:grid;grid-template-columns:130px 1fr 140px;align-items:center;gap:12px}
.fin-bar-label{font-size:12px;font-weight:600;color:var(--text-muted)}
.fin-bar-track{height:22px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex}
.fin-bar-seg{height:100%}
.fin-bar-seg.ingressos{background:var(--accent)}
.fin-bar-seg.copa{background:var(--info)}
.fin-bar-seg.custo{background:var(--text-muted)}
.fin-bar-value{font-family:var(--font-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fin-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);margin-top:2px}
.fin-legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.fin-callout{
  display:flex;align-items:center;gap:10px;border-radius:var(--radius);padding:14px 16px;font-size:13px;font-weight:600;
}
.fin-callout.negative{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.fin-callout.positive{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.fin-scenario{margin-bottom:22px}
.fin-scenario h3{font-size:15px;margin:0 0 2px;color:var(--text)}
.fin-scenario-sub{display:block;font-size:12px;color:var(--text-muted);margin-bottom:12px}
.fin-hero{
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  border-radius:var(--radius);padding:20px 24px;margin-bottom:18px;border:1px solid;
}
.fin-hero.negative{background:var(--bad-soft);border-color:var(--bad)}
.fin-hero.positive{background:var(--good-soft);border-color:var(--good)}
.fin-hero-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.fin-hero-number{font-family:var(--font-display);font-size:42px;font-weight:700;line-height:1.1;margin:2px 0}
.fin-hero.negative .fin-hero-label,.fin-hero.negative .fin-hero-number{color:var(--bad)}
.fin-hero.positive .fin-hero-label,.fin-hero.positive .fin-hero-number{color:var(--good)}
.fin-hero-sub{font-size:12.5px;opacity:.9}
.fin-hero-side{font-size:12px;line-height:1.6;text-align:right;color:var(--text-muted)}

@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .field-grid{grid-template-columns:repeat(2,1fr)}
  .field.span2{grid-column:span 2}
  .field.span4{grid-column:span 2}
  .modal-grid{grid-template-columns:1fr}
  .fin-grid{grid-template-columns:repeat(2,1fr)}
  .fin-bar-row{grid-template-columns:100px 1fr 100px}
}
.login-gate{
  position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:100;
}
.login-gate[hidden]{display:none}
.login-card{
  width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:32px 28px;box-shadow:var(--shadow);text-align:center;
}
.login-wordmark{font-family:var(--font-display);font-size:34px;color:var(--accent);letter-spacing:.02em;margin-bottom:4px}
.login-card h1{font-size:20px;margin-bottom:4px}
.login-sub{color:var(--text-muted);font-size:12.5px;margin:0 0 20px}
#loginForm{display:flex;flex-direction:column;gap:12px;text-align:left}
#loginForm label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);display:flex;flex-direction:column;gap:5px}
#loginForm input{font-size:14px;padding:9px 10px}
#loginForm .btn{margin-top:6px;justify-content:center}
.login-error{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:7px;padding:8px 10px;font-size:12.5px;font-weight:600}
.login-forgot{margin-top:16px;background:none;border:none;color:var(--text-muted);font-size:12px;text-decoration:underline;cursor:pointer}
.login-forgot:hover{color:var(--text)}
.login-loading{margin-top:16px;font-size:12.5px;color:var(--text-muted)}
#logoutBar{position:fixed;top:12px;right:16px;z-index:60}
#logoutBar[hidden]{display:none}
.logout-btn{
  background:var(--surface);color:var(--text-muted);border:1px solid var(--border);border-radius:7px;
  padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);
}
.logout-btn:hover{color:var(--text)}
.print-only{display:none}
.print-doc{font-family:inherit;color:#000;background:#fff}
.print-doc h1{font-size:20px;margin:0 0 4px}
.print-doc h2{font-size:14px;margin:18px 0 6px;border-bottom:1px solid #000;padding-bottom:3px}
.print-doc .print-meta{font-size:12px;margin-bottom:10px;color:#333}
.print-doc table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}
.print-doc th,.print-doc td{border:1px solid #999;padding:4px 6px;text-align:left}
.print-doc .print-empty{font-size:12px;color:#555;font-style:italic}
.print-doc .print-result{font-size:13px;margin-top:4px}
.print-doc .print-result strong{font-size:15px}
.print-doc .print-note{font-size:11px;color:#555;font-style:italic}
@media print{
  body *{visibility:hidden}
  #printSummary,#printSummary *{visibility:visible}
  #printSummary{display:block;position:absolute;left:0;top:0;width:100%;margin:0;padding:16px}
}

  function fmtDate(iso){
    if(!iso)return "—";
    var p=iso.split("-");if(p.length!==3)return iso;
    return p[2]+"/"+p[1]+"/"+p[0];
  }
  function fmtMoney(v){
    if(v==null||v==="")return "—";
    var n=Number(v);if(isNaN(n))return "—";
    var sign=n<0?"-":"";
    return sign+"R$ "+Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function daysUntil(iso){
    if(!iso)return null;
    var a=new Date(iso+"T00:00:00"),b=new Date(todayISO()+"T00:00:00");
    return Math.round((a-b)/86400000);
  }
  function findEvent(s,id){for(var i=0;i<s.events.length;i++)if(s.events[i].id===id)return s.events[i];return null;}
  function partnerEventIds(profile){
    if(!profile)return [];
    if(Array.isArray(profile.eventIds)&&profile.eventIds.length)return profile.eventIds;
    if(profile.eventId)return [profile.eventId];
    return [];
  }
  function gcalTaskUrl(ev,t){
    if(!t.prazo)return "";
    var start=new Date(t.prazo+"T00:00:00");
    var end=new Date(start.getTime());
    end.setDate(end.getDate()+1);
    function ymd(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");}
    var ladoLabel="";
    for(var i=0;i<LADOS.length;i++)if(LADOS[i][0]===t.lado)ladoLabel=LADOS[i][1];
    var detailLines=[];
    if(t.categoria)detailLines.push("Categoria: "+t.categoria);
    if(ladoLabel)detailLines.push("Lado: "+ladoLabel);
    if(t.responsavel)detailLines.push("Responsável: "+t.responsavel);
    if(t.obs)detailLines.push("Obs: "+t.obs);
    detailLines.push("Painel Fuga · "+(ev.nome||"Evento"));
    var text=encodeURIComponent((ev.nome||"Evento")+" — "+(t.titulo||"Tarefa"));
    var details=encodeURIComponent(detailLines.join("\n"));
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+text+"&dates="+ymd(start)+"/"+ymd(end)+"&details="+details;
  }

  function toast(msg){
    var el=document.getElementById("toast");
    if(!el)return;
    el.textContent=msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){el.classList.remove("show");},3200);
  }

  function persist(newState,opts){
    var oldState=state;
    state=newState;
    render();
    saveUi();
    if(!window.__fugaSave){
      if(!readOnly){readOnly=true;render();}
      toast("Não salvo — sem conexão com o banco de dados. Recarregue a página.");
      return;
    }
    window.__fugaSave(newState,oldState).catch(function(err){
      var code=err&&err.code?err.code:"";
      if(code==="permission-denied"){
        readOnly=true;
        render();
        toast("Sem permissão para salvar — fale com quem administra o painel.");
        return;
      }
      toast("Não foi possível salvar agora"+(code?" ("+code+")":"")+". Tente novamente.");
    });
  }

  function applyRemoteState(newState){
    try{
      if(JSON.stringify(newState)===JSON.stringify(state))return;
    }catch(e){}
    var ae=document.activeElement;
    var editing=ae&&appEl&&appEl.contains(ae)&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT"||ae.isContentEditable);
    if(editing){pendingRemoteState=newState;return;}
    state=newState;
    render();
    saveUi();
  }

  /* ---------- derived data ---------- */
  function taskProgress(ev){
    var total=ev.tasks.length,done=0;
    for(var i=0;i<ev.tasks.length;i++)if(ev.tasks[i].status==="concluido")done++;
    return {done:done,total:total,pct:total?Math.round(done/total*100):0};
  }
  function overdueTasks(ev){
    var t=todayISO(),out=[];
    for(var i=0;i<ev.tasks.length;i++){
      var tk=ev.tasks[i];
      if(tk.prazo&&tk.prazo<t&&tk.status!=="concluido")out.push(tk);
    }
    return out;
  }
  function upcomingTasks(ev,days){
    var out=[];
    for(var i=0;i<ev.tasks.length;i++){
      var tk=ev.tasks[i];
      if(tk.status==="concluido"||!tk.prazo)continue;
      var d=daysUntil(tk.prazo);
      if(d!==null&&d>=0&&d<=days)out.push(tk);
    }
    return out;
  }
  function pendingAlerts(events){
    var list=[];
    events.forEach(function(ev){
      if(ev.status==="cancelado")return;
      (ev.tasks||[]).forEach(function(tk){
        if(tk.status==="concluido"||!tk.prazo)return;
        list.push({event:ev,task:tk});
      });
    });
    list.sort(function(a,b){return a.task.prazo.localeCompare(b.task.prazo);});
    return list;
  }
  function groupAlertsByResponsavel(alerts){
    var map={},order=[];
    alerts.forEach(function(a){
      var nome=(a.task.responsavel||"").trim();
      var key=nome||"__sem__";
      if(!map[key]){map[key]={key:key,nome:nome||"Sem responsável",alerts:[]};order.push(key);}
      map[key].alerts.push(a);
    });
    return order.map(function(k){return map[k];});
  }
  function loteAtual(ev){
    var lotes=ev.lotes||[];
    for(var i=0;i<lotes.length;i++)if(lotes[i].status==="ativo")return lotes[i];
    var future=lotes.filter(function(l){return l.status==="planejado";}).sort(function(a,b){return (a.dataInicio||"").localeCompare(b.dataInicio||"");});
    return future[0]||null;
  }
  function financeSummary(ev){
    var lotes=ev.lotes||[],custos=ev.custos||[],patrocinios=ev.patrocinios||[],adiantamentos=ev.adiantamentos||[];
    var vendidos=lotes.reduce(function(s,l){return s+(Number(l.vendidos)||0);},0);
    var receitaIngressos=lotes.reduce(function(s,l){return s+(Number(l.vendidos)||0)*(Number(l.preco)||0);},0);
    var totalCustos=custos.reduce(function(s,c){return s+(Number(c.valor)||0);},0);
    var totalPatrocinio=patrocinios.reduce(function(s,p){return s+(Number(p.valor)||0);},0);
    var totalAdiantamentoFuga=adiantamentos.filter(function(a){return a.quem!=="parceiro";}).reduce(function(s,a){return s+(Number(a.valor)||0);},0);
    var totalAdiantamentoParceiro=adiantamentos.filter(function(a){return a.quem==="parceiro";}).reduce(function(s,a){return s+(Number(a.valor)||0);},0);
    var totalAdiantamento=totalAdiantamentoFuga+totalAdiantamentoParceiro;
    var gastoBar=Number(ev.gastoMedioBar)||0;
    var margemPct=ev.margemCopa==null?30:Number(ev.margemCopa);
    var quebraPct=ev.quebraPct==null?10:Number(ev.quebraPct);
    var cortesiaPessoas=Number(ev.cortesiaPessoas)||0;
    var vendasDia=Number(ev.vendasDiaEsperadas)||0;
    var ultimoLote=lotes.length?lotes[lotes.length-1]:null;
    var precoUltimoLote=ultimoLote?Number(ultimoLote.preco)||0:0;
    var isCollab=ev.tipo==="collab";
    var percParceiroPorta=ev.percParceiroPorta==null?0:Number(ev.percParceiroPorta);
    var percParceiroCopa=ev.percParceiroCopa==null?0:Number(ev.percParceiroCopa);

    function cenario(ticketsPagos,receitaTickets,presencaPaganteAjustada,cortesia){
      var presencaTotal=presencaPaganteAjustada+cortesia;
      var receitaBar=presencaTotal*gastoBar;
      var lucroCopa=receitaBar*(margemPct/100);
      var receitaTotal=receitaTickets+lucroCopa+totalPatrocinio;
      var saldo=receitaTotal-totalCustos;
      var ingressosNecessarios=(saldo<0&&precoUltimoLote>0)?Math.ceil((-saldo)/precoUltimoLote):0;
      var repassePorta=isCollab?receitaTickets*(percParceiroPorta/100):0;
      var repasseCopa=isCollab?lucroCopa*(percParceiroCopa/100):0;
      var repasseTotal=repassePorta+repasseCopa;
      var saldoFuga=saldo-repasseTotal;
      return {
        ingressos:ticketsPagos,presencaTotal:presencaTotal,receitaIngressos:receitaTickets,
        receitaBar:receitaBar,lucroCopa:lucroCopa,receitaTotal:receitaTotal,saldo:saldo,
        ingressosNecessarios:ingressosNecessarios,
        repassePorta:repassePorta,repasseCopa:repasseCopa,repasseTotal:repasseTotal,saldoFuga:saldoFuga
      };
    }

    // Cenário atual: só o que já foi vendido (porta + copa), sem cortesia e sem vendas do dia.
    var presencaPreVendaAjustada=vendidos*(1-quebraPct/100);
    var atual=cenario(vendidos,receitaIngressos,presencaPreVendaAjustada,0);

    // Cenário possível: porta atual + cortesia (pessoas) + vendas esperadas no dia,
    // usando o valor do último lote cadastrado para precificar essas vendas extras.
    var possivelTickets=vendidos+vendasDia;
    var possivelReceitaIngressos=receitaIngressos+vendasDia*precoUltimoLote;
    var possivel=cenario(possivelTickets,possivelReceitaIngressos,presencaPreVendaAjustada+vendasDia,cortesiaPessoas);

    return {
      vendidos:vendidos,totalCustos:totalCustos,gastoBar:gastoBar,margemPct:margemPct,
      quebraPct:quebraPct,cortesiaPessoas:cortesiaPessoas,vendasDia:vendasDia,
      ultimoLote:ultimoLote,precoUltimoLote:precoUltimoLote,atual:atual,possivel:possivel,
      isCollab:isCollab,percParceiroPorta:percParceiroPorta,percParceiroCopa:percParceiroCopa,
      totalPatrocinio:totalPatrocinio,totalAdiantamento:totalAdiantamento,
      totalAdiantamentoFuga:totalAdiantamentoFuga,totalAdiantamentoParceiro:totalAdiantamentoParceiro
    };
  }

  /* ---------- render: dashboard ---------- */
  function renderDashboard(){
    var events=state.events||[];
    var totalAtivos=events.filter(function(e){return e.status!=="cancelado";}).length;
    var collabAndamento=events.filter(function(e){return e.tipo==="collab"&&e.status!=="cancelado"&&e.status!=="concluido";}).length;
    var atrasadas=0;
    events.forEach(function(e){if(e.status!=="cancelado")atrasadas+=overdueTasks(e).length;});
    var futuros=events.filter(function(e){return e.status!=="cancelado"&&e.data&&e.data>=todayISO();}).sort(function(a,b){return a.data.localeCompare(b.data);});
    var proximo=futuros[0];

    var filtered=events.filter(function(e){
      if(ui.filterStatus&&e.status!==ui.filterStatus)return false;
      if(ui.filterTipo&&e.tipo!==ui.filterTipo)return false;
      if(ui.search){
        var q=ui.search.toLowerCase();
        var hay=(e.nome+" "+(e.local||e.cidade||"")+" "+(e.parceiro||"")).toLowerCase();
        if(hay.indexOf(q)===-1)return false;
      }
      return true;
    }).sort(function(a,b){return (a.data||"9999").localeCompare(b.data||"9999");});

    var rows=filtered.map(function(e){
      var prog=taskProgress(e);
      var od=e.status!=="cancelado"?overdueTasks(e):[];
      var lote=loteAtual(e);
      var fin=financeSummary(e);
      var tipoLabel=e.tipo==="collab"?('<span class="pill pill-collab">Collab'+(e.parceiro?" · "+esc(e.parceiro):"")+'</span>'):'<span class="pill pill-proprio">Próprio</span>';
      var finCell=(e.custos&&e.custos.length)||(e.lotes&&e.lotes.some(function(l){return l.vendidos;}))
        ?'<span class="mono" style="color:'+(fin.atual.saldo<0?"var(--bad)":"var(--good)")+'">'+fmtMoney(fin.atual.saldo)+'</span>'
        :'<span style="color:var(--text-muted)">—</span>';
      var mapaAtivo=MAPS.filter(function(mm){return mm.id===e.mapaSelecionado;})[0];
      return '<tr class="row-clickable" data-action="open-event" data-id="'+e.id+'">'
        +'<td class="mono">'+fmtDate(e.data)+'</td>'
        +'<td><div class="event-name">'+esc(e.nome||"Sem nome")+'</div><div class="event-sub">'+esc([(e.local||e.cidade||""),(mapaAtivo?mapaAtivo.nome.split(" — ")[0]:"")].filter(Boolean).join(" · "))+'</div></td>'
        +'<td>'+tipoLabel+'</td>'
        +'<td><span class="pill pill-'+e.status+'">'+statusLabel(STATUS_EVENTO,e.status)+'</span></td>'
        +'<td><div class="progress-cell"><div class="progress-track"><div class="progress-fill" style="width:'+prog.pct+'%"></div></div><span class="progress-frac">'+prog.done+"/"+prog.total+'</span></div></td>'
        +'<td class="mono">'+(lote?esc(lote.nome)+' · '+fmtMoney(lote.preco):"—")+'</td>'
        +'<td>'+finCell+'</td>'
        +'<td>'+(od.length?'<span class="alert-flag">'+ICONS.alert+od.length+" atrasada"+(od.length>1?"s":"")+'</span>':'<span style="color:var(--text-muted)">—</span>')+'</td>'
        +'</tr>';
    }).join("");

    var tableOrEmpty=events.length===0
      ? (window.__fugaRole==="partner"
        ? '<div class="empty"><h3>Nenhum evento vinculado</h3><p>Sua conta ainda não tem nenhum evento vinculado. Peça para quem administra o painel liberar o acesso.</p></div>'
        : '<div class="empty"><h3>Nenhum evento cadastrado</h3><p>Cadastre o primeiro evento para começar a acompanhar passagens, hotel, som, riders, transfers e ingressos em um só lugar.</p>'
          +(readOnly?"":'<button class="btn btn-primary" data-action="new-event">'+ICONS.plus+"Novo evento</button>")
          +'</div>')
      : (filtered.length===0
        ? '<div class="empty"><h3>Nada encontrado</h3><p>Ajuste a busca ou os filtros para ver outros eventos.</p></div>'
        : '<div class="table-wrap"><table><thead><tr>'
          +"<th>Data</th><th>Evento</th><th>Tipo</th><th>Status</th><th>Tarefas</th><th>Lote atual</th><th>Financeiro</th><th>Alertas</th>"
          +"</tr></thead><tbody>"+rows+"</tbody></table></div>");

    return ""
      +(readOnly?'<div class="banner">'+ICONS.alert+"Suas alterações NÃO estão sendo salvas nesta janela — peça a quem compartilhou o link para conferir sua permissão de edição.</div>":"")
      +'<div class="topbar"><div class="brand"><img class="brand-logo" src="'+LOGO_SRC+'" alt="Fuga"><div><h1>Painel de Eventos</h1></div></div>'
      +'<div class="topbar-actions">'+refreshBarHtml()+(window.__fugaRole==="admin"?'<button class="btn btn-ghost" data-action="open-access-modal">Acessos de parceiros</button>':"")+(readOnly||window.__fugaRole!=="admin"?"":'<button class="btn btn-primary" data-action="new-event">'+ICONS.plus+"Novo evento</button>")+"</div>"
      +"</div>"
      +renderAlerts()
      +'<div class="stats">'
      +'<div class="stat"><span class="n">'+totalAtivos+'</span><span class="l">Eventos ativos</span></div>'
      +'<div class="stat"><span class="n">'+collabAndamento+'</span><span class="l">Collab em andamento</span></div>'
      +'<div class="stat"><span class="n '+(atrasadas>0?"bad":"")+'">'+atrasadas+'</span><span class="l">Tarefas atrasadas</span></div>'
      +'<div class="stat"><span class="n" style="font-size:20px">'+(proximo?esc(proximo.nome):"—")+'</span><span class="l">Próximo evento</span><span class="sub mono">'+(proximo?fmtDate(proximo.data):"")+'</span></div>'
      +"</div>"
      +'<div class="filterbar">'
      +'<input type="search" placeholder="Buscar evento, local ou parceiro…" value="'+esc(ui.search)+'" data-uiaction="search">'
      +'<select data-uiaction="filter-status"><option value="">Todos os status</option>'+STATUS_EVENTO.map(function(s){return '<option value="'+s[0]+'"'+(ui.filterStatus===s[0]?" selected":"")+'>'+s[1]+"</option>";}).join("")+'</select>'
      +'<select data-uiaction="filter-tipo"><option value="">Collab e próprio</option><option value="collab"'+(ui.filterTipo==="collab"?" selected":"")+'>Só collab</option><option value="proprio"'+(ui.filterTipo==="proprio"?" selected":"")+'>Só próprio</option></select>'
      +'<span class="spacer"></span>'
      +'<span class="count-pill">'+filtered.length+" de "+events.length+' eventos</span>'
      +"</div>"
      +tableOrEmpty;
  }

  function statusLabel(list,val){
    for(var i=0;i<list.length;i++)if(list[i][0]===val)return list[i][1];
    return val;
  }

  function tipoIngressoOptionsHtml(current){
    var list=TIPOS_INGRESSO.slice();
    var cur=current||"";
    if(cur&&list.indexOf(cur)===-1)list.unshift(cur);
    return '<option value=""'+(cur?"":" selected")+'>Selecione…</option>'
      +list.map(function(t){return '<option'+(t===cur?" selected":"")+'>'+esc(t)+"</option>";}).join("");
  }

  function refreshBarHtml(){
    return '<div class="refresh-bar"><button type="button" class="btn btn-ghost btn-sm" data-action="refresh-now" title="Recarrega a página para buscar as últimas alterações de todos">'+ICONS.refresh+"Atualizar agora</button></div>";
  }

  function renderAlertRow(a){
    var d=daysUntil(a.task.prazo);
    var cls=d<0?"overdue":(d<=3?"soon":"upcoming");
    var dueLabel=d<0?"atrasada há "+Math.abs(d)+" dia"+(Math.abs(d)===1?"":"s"):d===0?"vence hoje":"faltam "+d+" dia"+(d===1?"":"s");
    return '<div class="alert-row '+cls+'">'
      +'<div class="alert-main"><div class="alert-title">'+esc(a.task.titulo)+'</div>'
      +'<div class="alert-sub"><button type="button" class="alert-event-link" data-action="open-event" data-id="'+a.event.id+'">'+esc(a.event.nome||"Sem nome")+'</button>'
      +' · <span class="pill pill-'+a.task.lado+'" style="padding:1px 7px">'+statusLabel(LADOS,a.task.lado)+'</span>'
      +' · <span class="mono">'+fmtDate(a.task.prazo)+"</span></div></div>"
      +'<div class="alert-due '+cls+'">'+dueLabel+"</div>"
      +(readOnly?"":'<button type="button" class="btn btn-ghost btn-sm" data-action="complete-task-quick" data-event-id="'+a.event.id+'" data-task-id="'+a.task.id+'">Concluir</button>')
      +"</div>";
  }
  function renderAlerts(){
    var alerts=pendingAlerts(state.events||[]);
    if(!alerts.length){
      return '<div class="section" id="sec-avisos"><div class="section-head"><h2>Avisos importantes</h2><span class="hint">Nenhum aviso pendente</span></div><div class="alerts-panel empty"><div class="alerts-empty">'+ICONS.alert+"Nenhum aviso pendente — tudo em dia.</div></div></div>";
    }
    var groups=groupAlertsByResponsavel(alerts);
    var colapsados=ui.avisosColapsados||{};
    var groupsHtml=groups.map(function(g){
      var isOpen=!colapsados[g.key];
      var overdueCount=g.alerts.filter(function(a){return daysUntil(a.task.prazo)<0;}).length;
      var countLabel=g.alerts.length+" pendente"+(g.alerts.length===1?"":"s")
        +(overdueCount?' · <span class="avisos-group-overdue">'+overdueCount+" atrasada"+(overdueCount===1?"":"s")+"</span>":"");
      return '<div class="avisos-group">'
        +'<button type="button" class="avisos-group-head" data-action="toggle-avisos-group" data-key="'+esc(g.key)+'" aria-expanded="'+(isOpen?"true":"false")+'">'
        +'<span class="avisos-chevron'+(isOpen?" open":"")+'">'+ICONS.chevron+'</span>'
        +'<span class="avisos-group-name">'+esc(g.nome)+'</span>'
        +'<span class="avisos-group-count">'+countLabel+'</span>'
        +'</button>'
        +(isOpen?'<div class="avisos-group-body">'+g.alerts.map(renderAlertRow).join("")+'</div>':"")
        +'</div>';
    }).join("");
    return '<div class="section" id="sec-avisos"><div class="section-head"><h2>Avisos importantes</h2><span class="hint">'+alerts.length+" tarefa"+(alerts.length===1?"":"s")+' com prazo pendente · '+groups.length+" responsáve"+(groups.length===1?"l":"is")+'</span></div><div class="alerts-panel">'+groupsHtml+"</div></div>";
  }

  /* ---------- colapso de seções, por evento (mantém cabeçalho sempre visível) ---------- */
  function secOpen(evId,key){
    return !(ui.secColapsadas&&ui.secColapsadas[evId]&&ui.secColapsadas[evId][key]);
  }
  function secHead(evId,key,titulo,hint){
    var open=secOpen(evId,key);
    return '<div class="section-head"><div class="section-head-left">'
      +'<button type="button" class="detail-collapse-btn" data-action="toggle-section" data-event="'+evId+'" data-section="'+key+'" aria-expanded="'+(open?"true":"false")+'" title="'+(open?"Minimizar":"Expandir")+'"><span class="avisos-chevron'+(open?" open":"")+'">'+ICONS.chevron+'</span></button>'
      +'<h2>'+titulo+'</h2></div><span class="hint">'+hint+'</span></div>';
  }

  /* ---------- render: detail ---------- */
  function renderDetail(){
    var ev=findEvent(state,ui.selectedEventId);
    if(!ev){ui.view="dashboard";ui.selectedEventId=null;return renderDashboard();}
    var prog=taskProgress(ev);
    var dis=readOnly?" disabled":"";

    var fieldGrid='<div class="field-grid">'
      +'<div class="field"><label>Data do evento</label><input type="date" value="'+esc(ev.data||"")+'" data-entity="event" data-id="'+ev.id+'" data-field="data"'+dis+'></div>'
      +'<div class="field"><label>Local</label><select data-entity="event" data-id="'+ev.id+'" data-field="local"'+dis+'><option value="">Selecione…</option>'+LOCAIS.map(function(loc){return '<option value="'+loc+'"'+((ev.local||ev.cidade)===loc?" selected":"")+'>'+loc+"</option>";}).join("")+'</select></div>'
      +'<div class="field"><label>Tipo</label><select data-entity="event" data-id="'+ev.id+'" data-field="tipo"'+dis+'><option value="collab"'+(ev.tipo==="collab"?" selected":"")+'>Collab</option><option value="proprio"'+(ev.tipo==="proprio"?" selected":"")+'>Próprio</option></select></div>'
      +'<div class="field"><label>Status</label><select data-entity="event" data-id="'+ev.id+'" data-field="status"'+dis+'>'+STATUS_EVENTO.map(function(s){return '<option value="'+s[0]+'"'+(ev.status===s[0]?" selected":"")+'>'+s[1]+"</option>";}).join("")+'</select></div>'
      +'<div class="field"><label>Estimativa de público</label><input type="number" step="1" min="0" placeholder="0" value="'+(ev.estimativaPublico==null?"":ev.estimativaPublico)+'" data-entity="event" data-id="'+ev.id+'" data-field="estimativaPublico"'+dis+'></div>'
      +(ev.tipo==="collab"?(
        '<div class="field span2"><label>Parceiro</label><input type="text" value="'+esc(ev.parceiro||"")+'" placeholder="Nome do parceiro / casa parceira" data-entity="event" data-id="'+ev.id+'" data-field="parceiro"'+dis+'></div>'
        +'<div class="field"><label>% da porta p/ parceiro</label><input type="number" step="1" min="0" max="100" style="min-width:100px" value="'+(ev.percParceiroPorta==null?"":ev.percParceiroPorta)+'" placeholder="0" data-entity="event" data-id="'+ev.id+'" data-field="percParceiroPorta"'+dis+'></div>'
        +'<div class="field"><label>% da copa p/ parceiro</label><input type="number" step="1" min="0" max="100" style="min-width:100px" value="'+(ev.percParceiroCopa==null?"":ev.percParceiroCopa)+'" placeholder="0" data-entity="event" data-id="'+ev.id+'" data-field="percParceiroCopa"'+dis+'></div>'
      ):"")
      +'<div class="field span4"><label>Notas gerais</label><textarea data-entity="event" data-id="'+ev.id+'" data-field="notas" placeholder="Observações gerais do evento…"'+dis+'>'+esc(ev.notas||"")+"</textarea></div>"

    var mapaAtualId=ev.mapaSelecionado||MAPS[0].id;

        +'<div class="map-list">'+MAPS.map(function(m,i){
          return '<button type="button" class="map-list-item'+(m.id===mapaAtualId?" active":"")+'" data-action="select-map" data-value="'+m.id+'"'+dis+'><span class="n">'+(i+1)+'</span>'+esc(m.nome)+'</button>';
        }).join("")+'</div>'
        +'</div>'

    var taskRows=ev.tasks.map(function(t){

        +'<td class="col-status"><select data-entity="task" data-id="'+t.id+'" data-field="status"'+rowDis+'>'+STATUS_TASK.map(function(s){return '<option value="'+s[0]+'"'+(t.status===s[0]?" selected":"")+'>'+s[1]+"</option>";}).join("")+"</select></td>"
        +'<td><input type="text" value="'+esc(t.responsavel||"")+'" placeholder="Quem cuida" data-entity="task" data-id="'+t.id+'" data-field="responsavel"'+rowDis+'></td>'
        +'<td><input type="date" value="'+esc(t.prazo||"")+'" data-entity="task" data-id="'+t.id+'" data-field="prazo"'+rowDis+'>'+(od?'<div class="alert-flag">'+ICONS.alert+"atrasada</div>":soon?'<div class="alert-flag warn">'+ICONS.alert+"prazo próximo</div>":"")+(t.prazo?'<button type="button" class="btn btn-ghost btn-sm" style="margin-top:4px;padding:4px 6px" data-action="add-to-gcal" data-id="'+t.id+'" title="Adicionar ao Google Calendar">'+ICONS.calendar+"</button>":"")+'</td>'

    var loteRows=(ev.lotes||[]).map(function(l){
      var rowDis=(readOnly||window.__fugaRole==="partner")?" disabled":"";

        +'<td><span class="money-field"><span class="money-prefix">R$</span><input type="number" step="5" value="'+(l.preco==null?"":l.preco)+'" placeholder="0,00" data-entity="lote" data-id="'+l.id+'" data-field="preco"'+rowDis+'></span></td>'

    var custoRows=(ev.custos||[]).map(function(c){

        +'<td><span class="money-field"><span class="money-prefix">R$</span><input type="number" step="5" value="'+(p.valor==null?"":p.valor)+'" placeholder="0,00" data-entity="patrocinio" data-id="'+p.id+'" data-field="valor"'+rowDis+'></span></td>'

      +'<nav class="quicknav"><a href="#sec-geral">Visão geral</a><a href="#sec-mapa">Mapa</a><a href="#sec-checklist">Checklist</a><a href="#sec-ingressos">Ingressos</a><a href="#sec-custos">Custos</a><a href="#sec-patrocinio">Patrocínio</a><a href="#sec-adiantamento">Adiantamento</a><a href="#sec-financeiro">Financeiro</a></nav>'

      +'<div class="section" id="sec-checklist">'+secHead(ev.id,"checklist","Checklist do evento",prog.done+" de "+prog.total+" tarefas concluídas")
      +(secOpen(ev.id,"checklist")?(
        '<div class="progress-summary"><div class="progress-track"><div class="progress-fill" style="width:'+prog.pct+'%"></div></div></div>'
        +'<div class="table-wrap"><table><thead><tr><th>Tarefa</th><th>Lado</th><th>Status</th><th>Responsável</th><th>Prazo</th><th>Valor (R$)</th><th>Observações</th><th></th></tr></thead><tbody>'
        +taskRows+"</tbody></table>"
        +(readOnly?"":'<div class="add-row">'
          +'<div class="field"><label>Categoria</label><select id="newTaskCategoria">'+CATEGORIAS.map(function(c){return "<option>"+c+"</option>";}).join("")+"</select></div>"
          +'<div class="field grow"><label>Título da tarefa</label><input type="text" id="newTaskTitulo" placeholder="Ex.: Confirmar horário de passagem de som"></div>'
          +'<div class="field"><label>Lado</label><select id="newTaskLado">'+LADOS.map(function(l){return '<option value="'+l[0]+'">'+l[1]+"</option>";}).join("")+"</select></div>"
          +'<div class="field"><label>Responsável</label><input type="text" id="newTaskResponsavel" placeholder="Quem cuida"></div>'
          +'<div class="field"><label>Prazo</label><input type="date" id="newTaskPrazo"></div>'
          +'<div class="field"><label>Valor (R$)</label><span class="money-field"><span class="money-prefix">R$</span><input type="number" step="5" id="newTaskValor" placeholder="0,00"></span></div>'
          +'<div class="field grow"><label>Observações</label><input type="text" id="newTaskObs" placeholder="Observações"></div>'
          +'<button class="btn btn-ghost btn-sm" data-action="add-task">'+ICONS.plus+"Adicionar tarefa</button>"
          +"</div>")
      ):"")
      +"</div>"
      +'<div class="section" id="sec-ingressos">'+secHead(ev.id,"ingressos","Lotes de ingresso","Tipo, valor e vendidos por lote")
      +(secOpen(ev.id,"ingressos")?(

        +"</tbody></table>"
        +(readOnly?"":'<div class="add-row">'

          +'<div class="field"><label>Valor (R$)</label><span class="money-field"><span class="money-prefix">R$</span><input type="number" step="5" id="newLotePreco" placeholder="0,00"></span></div>'
          +'<div class="field"><label>Vendidos</label><input type="number" id="newLoteVendidos" placeholder="0"></div>'
          +'<button class="btn btn-ghost btn-sm" data-action="add-lote">'+ICONS.plus+"Adicionar lote</button>"
          +"</div>")
      ):"")
      +"</div>"
      +'<div class="section" id="sec-custos">'+secHead(ev.id,"custos","Custos do evento","Bandas, DJs, produção, estrutura, marketing…")
      +(secOpen(ev.id,"custos")?(
        '<div class="table-wrap"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Valor (R$)</th><th></th></tr></thead><tbody>'

        +"</tbody></table>"
        +(readOnly?"":'<div class="add-row">'
          +'<div class="field grow"><label>Descrição</label><input type="text" id="newCustoDescricao" placeholder="Ex.: Cachê DJ Fulano"></div>'
          +'<div class="field"><label>Categoria</label><select id="newCustoCategoria">'+CATEGORIAS_CUSTO.map(function(c){return "<option>"+c+"</option>";}).join("")+"</select></div>"
          +'<div class="field"><label>Valor (R$)</label><span class="money-field"><span class="money-prefix">R$</span><input type="number" step="5" id="newCustoValor" placeholder="0,00"></span></div>'
          +'<button class="btn btn-ghost btn-sm" data-action="add-custo">'+ICONS.plus+"Adicionar custo</button>"
          +"</div>")
      ):"")
      +"</div>"
      +'<div class="section" id="sec-patrocinio">'+secHead(ev.id,"patrocinio","Cota de patrocínio","Grana que conseguimos, ou que o parceiro conseguiu de fora — soma na receita do evento")
      +(secOpen(ev.id,"patrocinio")?(
        '<div class="table-wrap"><table><thead><tr><th>Descrição</th><th>Valor (R$)</th><th></th></tr></thead><tbody>'
        +(patrocinioRows||'<tr><td colspan="3" style="color:var(--text-muted);text-align:center;padding:20px">Nenhuma cota de patrocínio cadastrada ainda</td></tr>')
        +"</tbody></table>"
        +(readOnly?"":'<div class="add-row">'
          +'<div class="field grow"><label>Descrição</label><input type="text" id="newPatrocinioDescricao" placeholder="Ex.: Patrocínio Marca X"></div>'
          +'<div class="field"><label>Valor (R$)</label><span class="money-field"><span class="money-prefix">R$</span><input type="number" step="5" id="newPatrocinioValor" placeholder="0,00"></span></div>'
          +'<button class="btn btn-ghost btn-sm" data-action="add-patrocinio">'+ICONS.plus+"Adicionar patrocínio</button>"
          +"</div>")
      ):"")
      +"</div>"
      +'<div class="section" id="sec-adiantamento">'+secHead(ev.id,"adiantamento","Adiantamento","Valor que a Fuga ou o parceiro adiantou — só informativo, não entra no saldo do evento")
      +(secOpen(ev.id,"adiantamento")?(
        '<div class="table-wrap"><table><thead><tr><th>Descrição</th><th>Quem adiantou</th><th>Valor (R$)</th><th></th></tr></thead><tbody>'
        +(adiantamentoRows||'<tr><td colspan="4" style="color:var(--text-muted);text-align:center;padding:20px">Nenhum adiantamento cadastrado ainda</td></tr>')
        +"</tbody></table>"
        +(readOnly?"":'<div class="add-row">'
          +'<div class="field grow"><label>Descrição</label><input type="text" id="newAdiantamentoDescricao" placeholder="Ex.: Sinal pago à banda"></div>'
          +'<div class="field"><label>Quem adiantou</label><select id="newAdiantamentoQuem"><option value="fuga">Fuga</option><option value="parceiro">Parceiro</option></select></div>'
          +'<div class="field"><label>Valor (R$)</label><span class="money-field"><span class="money-prefix">R$</span><input type="number" step="5" id="newAdiantamentoValor" placeholder="0,00"></span></div>'
          +'<button class="btn btn-ghost btn-sm" data-action="add-adiantamento">'+ICONS.plus+"Adicionar adiantamento</button>"
          +"</div>")
      ):"")
      +"</div>"
      +renderFinanceiro(ev);

    return ""
      +(readOnly?'<div class="banner">'+ICONS.alert+"Suas alterações NÃO estão sendo salvas nesta janela — peça a quem compartilhou o link para conferir sua permissão de edição.</div>":"")
      +'<div class="detail-topbar">'+(window.__fugaRole==="partner"&&partnerEventIds(window.__fugaProfile).length<=1?'<span class="back-link" style="cursor:default;text-decoration:none">'+esc(ev.nome||"Evento")+'</span>':'<button class="back-link" data-action="back">'+iconLeft()+(window.__fugaRole==="partner"?"Meus eventos":"Todos os eventos")+'</button>')+'<button class="btn btn-ghost" data-action="print-summary" data-id="'+ev.id+'">'+ICONS.printer+"Resumo do evento (PDF)</button>"+refreshBarHtml()+"</div>"
      +'<div class="detail-head"><div class="detail-title-row">'
      +'<input class="title-input" value="'+esc(ev.nome||"")+'" placeholder="Nome do evento" data-entity="event" data-id="'+ev.id+'" data-field="nome"'+dis+'>'
      +'<span class="pill pill-'+ev.status+'">'+statusLabel(STATUS_EVENTO,ev.status)+'</span>'
      +(ev.tipo==="collab"?'<span class="pill pill-collab">Collab'+(ev.parceiro?" · "+esc(ev.parceiro):"")+'</span>':'<span class="pill pill-proprio">Próprio</span>')
      +"</div>"
      +(readOnly||window.__fugaRole==="partner"?"":'<button class="btn btn-danger" data-action="delete-event" data-id="'+ev.id+'">'+ICONS.trash+"Excluir evento</button>")
      +"</div>"
      +detailBody;
  }

  function iconLeft(){return '<svg class="icon" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';}

  function renderFinanceiro(ev){
    var f=financeSummary(ev);
    var a=f.atual,pv=f.possivel;
    var dis=readOnly?" disabled":"";

    var hero='<div class="fin-hero '+(a.saldo<0?"negative":"positive")+'">'
      +'<div><div class="fin-hero-label">'+(a.saldo<0?"Para o break-even no cenário atual, ainda faltam":"Break-even do cenário atual")+'</div>'
      +'<div class="fin-hero-number">'+(a.saldo<0?a.ingressosNecessarios+(a.ingressosNecessarios===1?" ingresso":" ingressos"):"Atingido")+'</div>'
      +'<div class="fin-hero-sub">'+(a.saldo<0
          ? "déficit de "+fmtMoney(Math.abs(a.saldo))+(f.ultimoLote?' · último lote "'+esc(f.ultimoLote.nome)+'" ('+fmtMoney(f.precoUltimoLote)+' cada)':" · cadastre um lote para calcular o preço de referência")
          : "folga de "+fmtMoney(a.saldo)+" acima dos custos, considerando só a pré-venda de hoje")
        +"</div></div>"
      +'<div class="fin-hero-side mono">'+f.vendidos+' ingressos na pré-venda<br>'+fmtMoney(a.receitaIngressos)+' já em caixa</div>'
      +"</div>";

    var maxBar=Math.max(a.receitaTotal,f.totalCustos,pv.receitaTotal,1);
    var barRow=function(label,ingressos,copa){
      var wI=Math.max(ingressos/maxBar*100,0),wC=Math.max(copa/maxBar*100,0);
      return '<div class="fin-bar-row"><span class="fin-bar-label">'+label+'</span><div class="fin-bar-track"><div class="fin-bar-seg ingressos" style="width:'+wI+'%"></div><div class="fin-bar-seg copa" style="width:'+wC+'%"></div></div><span class="fin-bar-value">'+fmtMoney(ingressos+copa)+'</span></div>';
    };
    var wCustos=Math.max(f.totalCustos/maxBar*100,0);
    var bars='<div class="fin-bars">'
      +barRow("Cenário atual",a.receitaIngressos,a.lucroCopa)
      +barRow("Cenário possível",pv.receitaIngressos,pv.lucroCopa)
      +'<div class="fin-bar-row"><span class="fin-bar-label">Custos totais</span><div class="fin-bar-track"><div class="fin-bar-seg custo" style="width:'+wCustos+'%"></div></div><span class="fin-bar-value">'+fmtMoney(f.totalCustos)+'</span></div>'
      +'<div class="fin-legend"><span><span class="dot" style="background:var(--accent)"></span>Ingressos</span><span><span class="dot" style="background:var(--info)"></span>Copa (bar)</span><span><span class="dot" style="background:var(--text-muted)"></span>Custos</span></div>'
      +"</div>";

    var scenarioBlock=function(title,sub,s){
      return '<div class="fin-scenario"><h3>'+title+'</h3><span class="fin-scenario-sub">'+sub+'</span>'
        +'<div class="stats fin-grid">'
        +'<div class="stat"><span class="n" style="font-size:22px">'+s.ingressos+'</span><span class="l">Ingressos</span></div>'
        +'<div class="stat"><span class="n" style="font-size:22px">'+fmtMoney(s.receitaIngressos)+'</span><span class="l">Receita da porta</span></div>'
        +'<div class="stat"><span class="n" style="font-size:22px">'+fmtMoney(s.lucroCopa)+'</span><span class="l">Lucro de copa ('+f.margemPct+'%)</span><span class="sub mono">presença: '+Math.round(s.presencaTotal)+' pessoas</span></div>'
        +(f.totalPatrocinio>0?'<div class="stat"><span class="n" style="font-size:22px">'+fmtMoney(f.totalPatrocinio)+'</span><span class="l">Cota de patrocínio</span></div>':"")
        +'<div class="stat"><span class="n" style="font-size:22px;color:'+(s.saldo<0?"var(--bad)":"var(--good)")+'">'+fmtMoney(s.saldo)+'</span><span class="l">Resultado (porta + copa'+(f.totalPatrocinio>0?" + patrocínio":"")+' − custos)</span></div>'
        +'</div>'
        +(f.isCollab?(
          '<div class="stats fin-grid" style="margin-top:12px">'

      +'<h2>Lotes de ingresso</h2>'

      +'<h2>Cota de patrocínio</h2>'
      +(patrocinioRowsP?'<table><thead><tr><th>Descrição</th><th>Valor</th></tr></thead><tbody>'+patrocinioRowsP+'</tbody></table>':'<div class="print-empty">Nenhuma cota de patrocínio cadastrada.</div>')
      +'<h2>Adiantamento <span class="print-note">(informativo, não entra no resultado abaixo)</span></h2>'
      +(adiantamentoRowsP?'<table><thead><tr><th>Descrição</th><th>Quem adiantou</th><th>Valor</th></tr></thead><tbody>'+adiantamentoRowsP+'</tbody></table>':'<div class="print-empty">Nenhum adiantamento cadastrado.</div>')
      +'<h2>Cenário atual <span class="print-note">(porta + copa, só o que já foi vendido)</span></h2>'
      +'<div class="print-result">Ingressos: '+a.ingressos+'</div>'
      +'<div class="print-result">Receita da porta: '+fmtMoney(a.receitaIngressos)+'</div>'
      +'<div class="print-result">Lucro de copa: '+fmtMoney(a.lucroCopa)+'</div>'

      +'<div class="print-result">Custos totais: '+fmtMoney(f.totalCustos)+'</div>'
      +'<div class="print-result"><strong>Resultado: '+fmtMoney(a.saldo)+'</strong></div>'
      +(f.isCollab?('<div class="print-result">Repasse total ao parceiro: '+fmtMoney(a.repasseTotal)+'</div><div class="print-result"><strong>Fica com a Fuga: '+fmtMoney(a.saldoFuga)+'</strong></div>'):"")
      +'<h2>Cenário possível <span class="print-note">(porta atual + cortesia + vendas esperadas no dia)</span></h2>'

      +(f.totalPatrocinio>0?'<div class="print-result">Cota de patrocínio: '+fmtMoney(f.totalPatrocinio)+'</div>':"")
      +'<div class="print-result">Custos totais: '+fmtMoney(f.totalCustos)+'</div>'
      +'<div class="print-result"><strong>Resultado: '+fmtMoney(pv.saldo)+'</strong></div>'
      +(f.isCollab?('<div class="print-result">Repasse total ao parceiro: '+fmtMoney(pv.repasseTotal)+'</div><div class="print-result"><strong>Fica com a Fuga: '+fmtMoney(pv.saldoFuga)+'</strong></div>'):"")
      +'<div class="print-note" style="margin-top:10px">Gerado em '+(new Date()).toLocaleDateString("pt-BR")+'.</div>'
      +'</div>';

  function refreshAccessList(){
    var box=document.getElementById("accessListBox");
    if(!box||!window.__fugaListPartners)return;
    window.__fugaListPartners().then(function(list){
      var box2=document.getElementById("accessListBox");
      if(!box2)return;
      if(!list.length){box2.className="hint";box2.textContent="Nenhum parceiro com acesso ainda.";return;}
      box2.className="";
      box2.innerHTML='<div class="table-wrap"><table><thead><tr><th>E-mail</th><th>Eventos</th><th>Adicionar evento</th><th></th></tr></thead><tbody>'
        +list.map(function(p){
          var pids=partnerEventIds(p);
          var chips=pids.length?pids.map(function(eid){
            var pev=findEvent(state,eid);
            return '<span class="pill pill-proprio" style="margin:2px 4px 2px 0;display:inline-flex;align-items:center;gap:4px">'+esc(pev?pev.nome:"(evento removido)")
              +'<button type="button" data-action="remove-partner-event" data-uid="'+esc(p.uid)+'" data-eventid="'+esc(eid)+'" title="Remover este evento do parceiro" style="background:none;border:none;color:inherit;cursor:pointer;padding:0;font-weight:700;line-height:1">×</button></span>';
          }).join(""):'<span class="hint">Nenhum evento</span>';
          var availableEvents=(state.events||[]).filter(function(e){return pids.indexOf(e.id)===-1;});
          var addControl=availableEvents.length
            ?'<select class="access-add-select" data-uid="'+esc(p.uid)+'">'+availableEvents.map(function(e){return '<option value="'+e.id+'">'+esc(e.nome||"Sem nome")+'</option>';}).join("")+'</select> <button type="button" class="btn btn-ghost btn-sm" data-action="add-partner-event" data-uid="'+esc(p.uid)+'">'+ICONS.plus+"Adicionar</button>"
            :'<span class="hint">—</span>';
          return '<tr><td>'+esc(p.email||"")+'</td><td>'+chips+'</td><td>'+addControl+'</td>'
            +'<td><button type="button" class="btn btn-danger btn-sm" data-action="revoke-partner-access" data-uid="'+esc(p.uid)+'" title="Revogar todo o acesso desse parceiro">'+ICONS.trash+"Revogar tudo</button></td></tr>";
        }).join("")
        +"</tbody></table></div>";
    }).catch(function(err){
      var box3=document.getElementById("accessListBox");
      if(box3){box3.className="hint";box3.style.color="var(--bad)";box3.textContent="Não foi possível carregar ("+(err&&err.code||"erro")+").";}
    });
  }

  function render(){

    root.innerHTML=(ui.view==="detail"?renderDetail():renderDashboard())

      +'<dialog id="accessDialog"></dialog>'
      +'<div class="toast" id="toast"></div>';
