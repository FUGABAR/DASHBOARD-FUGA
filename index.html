  /* ---------- event delegation ---------- */
  function onClick(e){
    var el=e.target.closest("[data-action]");
    if(!el)return;
    var action=el.dataset.action;
    var PARTNER_BLOCKED={"new-event":1,"create-event":1,"delete-event":1,"open-access-modal":1,"create-partner-access":1,"revoke-partner-access":1,"add-partner-event":1,"remove-partner-event":1,"remove-task":1,"remove-lote":1,"remove-custo":1,"remove-patrocinio":1,"remove-adiantamento":1};
    if(window.__fugaRole==="partner"&&PARTNER_BLOCKED[action])return;
    if(action==="refresh-now"){
      saveUi();location.reload();
    }else if(action==="toggle-avisos-group"){
      var gkey=el.dataset.key;
      ui.avisosColapsados=ui.avisosColapsados||{};
      ui.avisosColapsados[gkey]=!ui.avisosColapsados[gkey];
      saveUi();render();
    }else if(action==="toggle-section"){
      var secEvId=el.dataset.event,secKey=el.dataset.section;
      ui.secColapsadas=ui.secColapsadas||{};
      ui.secColapsadas[secEvId]=ui.secColapsadas[secEvId]||{};
      ui.secColapsadas[secEvId][secKey]=!ui.secColapsadas[secEvId][secKey];
      saveUi();render();
    }else if(action==="open-event"){
      ui.view="detail";ui.selectedEventId=el.dataset.id;saveUi();render();
    }else if(action==="back"){
      ui.view="dashboard";ui.selectedEventId=null;saveUi();render();
    }else if(action==="new-event"){
      openNewEventModal();
    }else if(action==="close-modal"){
      closeModal();
    }else if(action==="create-event"){
      var nome=(document.getElementById("neNome").value||"").trim();
      if(!nome){toast("Dê um nome ao evento antes de criar.");return;}
      var tipo=document.getElementById("neTipo").value;
      var ev={
        id:uid(),
        nome:nome,
        data:document.getElementById("neData").value,
        local:document.getElementById("neLocal").value,
        tipo:tipo,
        parceiro:tipo==="collab"?(document.getElementById("neParceiro").value||"").trim():"",
        percParceiroPorta:tipo==="collab"?(parseFloat(document.getElementById("neParceiroPercPorta").value)||0):0,
        percParceiroCopa:tipo==="collab"?(parseFloat(document.getElementById("neParceiroPercCopa").value)||0):0,
        status:"planejamento",
        notas:"",
        estimativaPublico:null,
        mapaSelecionado:null,
        tasks:TASK_TEMPLATE.map(function(t){return {id:uid(),categoria:t.categoria,titulo:t.titulo,lado:t.lado,status:"pendente",responsavel:"",prazo:"",valor:null,obs:""};}),
        lotes:[],
        custos:[],
        patrocinios:[],
        adiantamentos:[],
        gastoMedioBar:null,
        margemCopa:30,
        quebraPct:10,
        cortesiaPessoas:null,
        vendasDiaEsperadas:null
      };
      var ns=deepClone(state);
      ns.events.push(ev);
      ui.view="detail";ui.selectedEventId=ev.id;
      closeModal();
      persist(ns);
    }else if(action==="delete-event"){
      if(confirm("Excluir este evento e todo o checklist? Essa ação não pode ser desfeita.")){
        var ns2=deepClone(state);
        ns2.events=ns2.events.filter(function(x){return x.id!==el.dataset.id;});
        ui.view="dashboard";ui.selectedEventId=null;
        persist(ns2);
      }
    }else if(action==="open-access-modal"){
      openAccessModal();
    }else if(action==="close-access-modal"){
      closeAccessModal();
    }else if(action==="create-partner-access"){
      if(!window.__fugaCreatePartner){toast("Função indisponível nesta janela.");return;}
      var accEmail=(document.getElementById("accessEmail").value||"").trim();
      var accSenha=document.getElementById("accessSenha").value||"";
      var accEventId=document.getElementById("accessEvento").value;
      if(!accEventId){toast("Cadastre um evento antes de liberar um acesso.");return;}
      if(!accEmail){toast("Digite o e-mail do parceiro.");return;}
      if(accSenha.length<6){toast("A senha provisória precisa ter pelo menos 6 caracteres.");return;}
      el.disabled=true;el.textContent="Criando…";
      window.__fugaCreatePartner(accEmail,accSenha,accEventId).then(function(){
        toast("Acesso criado para "+accEmail+".");
        var emailEl=document.getElementById("accessEmail"),senhaEl=document.getElementById("accessSenha");
        if(emailEl)emailEl.value="";
        if(senhaEl)senhaEl.value="";
        refreshAccessList();
      }).catch(function(err){
        var code=err&&err.code?err.code:"";
        var msg=code==="auth/email-already-in-use"?"Já existe uma conta com esse e-mail.":
          code==="auth/weak-password"?"A senha precisa ter pelo menos 6 caracteres.":
          code==="auth/invalid-email"?"Digite um e-mail válido.":
          "Não foi possível criar o acesso"+(code?" ("+code+")":"")+".";
        toast(msg);
      }).finally(function(){
        var btn=document.querySelector('[data-action="create-partner-access"]');
        if(btn){btn.disabled=false;btn.innerHTML=ICONS.plus+"Criar acesso";}
      });
    }else if(action==="revoke-partner-access"){
      if(!window.__fugaRevokePartner)return;
      if(!confirm("Revogar o acesso desse parceiro? Ele não vai mais conseguir entrar no evento."))return;
      window.__fugaRevokePartner(el.dataset.uid).then(function(){
        toast("Acesso revogado.");
        refreshAccessList();
      }).catch(function(err){
        toast("Não foi possível revogar ("+(err&&err.code||"erro")+").");
      });
    }else if(action==="add-partner-event"){
      if(!window.__fugaAddPartnerEvent)return;
      var addSelect=document.querySelector('.access-add-select[data-uid="'+el.dataset.uid+'"]');
      var addEventId=addSelect?addSelect.value:"";
      if(!addEventId){toast("Escolha um evento para adicionar.");return;}
      el.disabled=true;
      window.__fugaAddPartnerEvent(el.dataset.uid,addEventId).then(function(){
        toast("Evento adicionado ao acesso do parceiro.");
        refreshAccessList();
      }).catch(function(err){
        toast("Não foi possível adicionar ("+(err&&err.code||"erro")+").");
      }).finally(function(){
        el.disabled=false;
      });
    }else if(action==="remove-partner-event"){
      if(!window.__fugaRemovePartnerEvent)return;
      if(!confirm("Remover esse evento do acesso do parceiro? Ele deixa de ver esse evento, mas continua com acesso aos outros."))return;
      window.__fugaRemovePartnerEvent(el.dataset.uid,el.dataset.eventid).then(function(){
        toast("Evento removido do acesso do parceiro.");
        refreshAccessList();
      }).catch(function(err){
        toast("Não foi possível remover ("+(err&&err.code||"erro")+").");
      });
    }else if(action==="add-to-gcal"){
        var evGc=findEvent(state,ui.selectedEventId);
        if(!evGc)return;
        var tGc=evGc.tasks.filter(function(x){return x.id===el.dataset.id;})[0];
        if(!tGc)return;
        var gcalUrl=gcalTaskUrl(evGc,tGc);
        if(gcalUrl)window.open(gcalUrl,"_blank","noopener");
      }else if(action==="remove-task"){
      var ns3=deepClone(state),ev3=findEvent(ns3,ui.selectedEventId);
      ev3.tasks=ev3.tasks.filter(function(t){return t.id!==el.dataset.id;});
      persist(ns3);
    }else if(action==="add-task"){
      var titEl=document.getElementById("newTaskTitulo");
      var titulo=(titEl.value||"").trim();
      if(!titulo){toast("Escreva o título da tarefa.");return;}
      var categoria=document.getElementById("newTaskCategoria").value;
      var lado=document.getElementById("newTaskLado").value;
      var respEl=document.getElementById("newTaskResponsavel");
      var prazoEl=document.getElementById("newTaskPrazo");
      var valorEl=document.getElementById("newTaskValor");
      var obsEl=document.getElementById("newTaskObs");
      var ns4=deepClone(state),ev4=findEvent(ns4,ui.selectedEventId);
      ev4.tasks.push({id:uid(),categoria:categoria,titulo:titulo,lado:lado,status:"pendente",responsavel:(respEl&&respEl.value||"").trim(),prazo:(prazoEl&&prazoEl.value)||"",valor:(valorEl&&valorEl.value!=="")?parseFloat(valorEl.value):null,obs:(obsEl&&obsEl.value||"").trim(),criadoPor:window.__fugaRole==="partner"?"partner":"admin"});
      persist(ns4);
    }else if(action==="remove-lote"){
      var ns5=deepClone(state),ev5=findEvent(ns5,ui.selectedEventId);
      ev5.lotes=ev5.lotes.filter(function(l){return l.id!==el.dataset.id;});
      persist(ns5);
    }else if(action==="add-lote"){
      var nomeEl=document.getElementById("newLoteNome");
      var nome2=(nomeEl.value||"").trim();
      if(!nome2){toast("Escolha o tipo de ingresso antes de adicionar.");return;}
      var preco=document.getElementById("newLotePreco").value;
      var vend=document.getElementById("newLoteVendidos").value;
      var ns6=deepClone(state),ev6=findEvent(ns6,ui.selectedEventId);
      ev6.lotes=ev6.lotes||[];
      ev6.lotes.push({id:uid(),nome:nome2,preco:preco===""?null:parseFloat(preco),vendidos:vend===""?0:parseInt(vend,10),status:"planejado",criadoPor:window.__fugaRole==="partner"?"partner":"admin"});
      persist(ns6);
    }else if(action==="add-custo"){
      var descEl=document.getElementById("newCustoDescricao");
      var desc=(descEl.value||"").trim();
      if(!desc){toast("Descreva o custo antes de adicionar.");return;}
      var catC=document.getElementById("newCustoCategoria").value;
      var valC=document.getElementById("newCustoValor").value;
      var ns7=deepClone(state),ev7=findEvent(ns7,ui.selectedEventId);
      ev7.custos=ev7.custos||[];
      ev7.custos.push({id:uid(),descricao:desc,categoria:catC,valor:valC===""?null:parseFloat(valC),criadoPor:window.__fugaRole==="partner"?"partner":"admin"});
      persist(ns7);
    }else if(action==="remove-custo"){
      var ns8=deepClone(state),ev8=findEvent(ns8,ui.selectedEventId);
      ev8.custos=(ev8.custos||[]).filter(function(c){return c.id!==el.dataset.id;});
      persist(ns8);
    }else if(action==="add-patrocinio"){
      var pDescEl=document.getElementById("newPatrocinioDescricao");
      var pDesc=(pDescEl.value||"").trim();
      if(!pDesc){toast("Descreva o patrocínio antes de adicionar.");return;}
      var pValEl=document.getElementById("newPatrocinioValor");
      var nsP=deepClone(state),evP=findEvent(nsP,ui.selectedEventId);
      evP.patrocinios=evP.patrocinios||[];
      evP.patrocinios.push({id:uid(),descricao:pDesc,valor:(pValEl&&pValEl.value!=="")?parseFloat(pValEl.value):null,criadoPor:window.__fugaRole==="partner"?"partner":"admin"});
      persist(nsP);
    }else if(action==="remove-patrocinio"){
      var nsPr=deepClone(state),evPr=findEvent(nsPr,ui.selectedEventId);
      evPr.patrocinios=(evPr.patrocinios||[]).filter(function(p){return p.id!==el.dataset.id;});
      persist(nsPr);
    }else if(action==="add-adiantamento"){
      var aDescEl=document.getElementById("newAdiantamentoDescricao");
      var aDesc=(aDescEl.value||"").trim();
      if(!aDesc){toast("Descreva o adiantamento antes de adicionar.");return;}
      var aQuemEl=document.getElementById("newAdiantamentoQuem");
      var aValEl=document.getElementById("newAdiantamentoValor");
      var nsA=deepClone(state),evA=findEvent(nsA,ui.selectedEventId);
      evA.adiantamentos=evA.adiantamentos||[];
      evA.adiantamentos.push({id:uid(),descricao:aDesc,quem:(aQuemEl&&aQuemEl.value)||"fuga",valor:(aValEl&&aValEl.value!=="")?parseFloat(aValEl.value):null,criadoPor:window.__fugaRole==="partner"?"partner":"admin"});
      persist(nsA);
    }else if(action==="remove-adiantamento"){
      var nsAr=deepClone(state),evAr=findEvent(nsAr,ui.selectedEventId);
      evAr.adiantamentos=(evAr.adiantamentos||[]).filter(function(a){return a.id!==el.dataset.id;});
      persist(nsAr);
    }else if(action==="print-summary"){
      var evPrint=findEvent(state,el.dataset.id);
      if(!evPrint)return;
      var psEl=document.getElementById("printSummary");
      if(psEl){psEl.innerHTML=buildPrintSummary(evPrint);}
      window.print();
    }else if(action==="select-map"){
      var ns9=deepClone(state),ev9=findEvent(ns9,ui.selectedEventId);
      ev9.mapaSelecionado=el.dataset.value;
      persist(ns9);
    }else if(action==="complete-task-quick"){
      var ns10=deepClone(state),ev10=findEvent(ns10,el.dataset.eventId);
      if(!ev10)return;
      var t10=(ev10.tasks||[]).filter(function(x){return x.id===el.dataset.taskId;})[0];
      if(!t10)return;
      t10.status="concluido";
      persist(ns10);
    }
  }

  function onChange(e){
    var el=e.target;
    var entity=el.dataset.entity;
    if(!entity)return;
    var id=el.dataset.id,field=el.dataset.field;
    var value=el.type==="number"?(el.value===""?null:parseFloat(el.value)):el.value;
    var ns=deepClone(state);
    if(entity==="event"){
      var ev=findEvent(ns,id);if(!ev)return;
      ev[field]=value;
      if(field==="tipo"&&value==="proprio"){ev.parceiro="";ev.percParceiroPorta=0;ev.percParceiroCopa=0;}
    }else if(entity==="task"){
      var ev2=findEvent(ns,ui.selectedEventId);if(!ev2)return;
      var t=ev2.tasks.filter(function(x){return x.id===id;})[0];if(!t)return;
      t[field]=value;
    }else if(entity==="lote"){
      var ev3=findEvent(ns,ui.selectedEventId);if(!ev3)return;
      var l=ev3.lotes.filter(function(x){return x.id===id;})[0];if(!l)return;
      l[field]=value;
    }else if(entity==="custo"){
      var ev4c=findEvent(ns,ui.selectedEventId);if(!ev4c)return;
      var c=(ev4c.custos||[]).filter(function(x){return x.id===id;})[0];if(!c)return;
      c[field]=value;
    }else if(entity==="patrocinio"){
      var ev4p=findEvent(ns,ui.selectedEventId);if(!ev4p)return;
      var pp=(ev4p.patrocinios||[]).filter(function(x){return x.id===id;})[0];if(!pp)return;
      pp[field]=value;
    }else if(entity==="adiantamento"){
      var ev4a=findEvent(ns,ui.selectedEventId);if(!ev4a)return;
      var aa=(ev4a.adiantamentos||[]).filter(function(x){return x.id===id;})[0];if(!aa)return;
      aa[field]=value;
    }else return;
    persist(ns);
  }

  function onInput(e){
    var el=e.target;
    if(el.dataset.uiaction!=="search")return;
    ui.search=el.value;
    saveUi();
    renderKeepFocus(el);
  }
  function onUiChange(e){
    var el=e.target;
    var act=el.dataset.uiaction;
    if(!act)return;
    if(act==="filter-status")ui.filterStatus=el.value;
    if(act==="filter-tipo")ui.filterTipo=el.value;
    saveUi();
    render();
  }
  function renderKeepFocus(sourceEl){
    var act=sourceEl.dataset.uiaction;
    var selStart=sourceEl.selectionStart,selEnd=sourceEl.selectionEnd;
    render();
    var again=document.querySelector('[data-uiaction="'+act+'"]');
    if(again){
      again.focus();
      try{again.setSelectionRange(selStart,selEnd);}catch(e){}
    }
  }

  function onKeydown(e){
    if(e.key==="Enter"&&(e.target.tagName==="INPUT")&&e.target.dataset.entity){
      e.target.blur();
    }
  }

  var appEl;
  function bind(){
    appEl=document.getElementById("app");
    appEl.addEventListener("click",onClick);
    appEl.addEventListener("change",onChange);
    appEl.addEventListener("change",onUiChange);
    appEl.addEventListener("input",onInput);
    appEl.addEventListener("keydown",onKeydown);
    appEl.addEventListener("focusout",function(){
      setTimeout(function(){
        var ae=document.activeElement;
        var stillEditing=ae&&appEl&&appEl.contains(ae)&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT"||ae.isContentEditable);
        if(!stillEditing&&pendingRemoteState){
          state=pendingRemoteState;pendingRemoteState=null;render();
        }
      },80);
    });
  }

  bind();
  render();
  window.__fugaApplyRemote=applyRemoteState;
}
window.__startFugaApp=App;
</script>

<script type="module">
/* =====================================================================
   CONFIGURAÇÃO DO FIREBASE — preencha com os dados do SEU projeto.
   Onde encontrar: console.firebase.google.com → seu projeto → ícone de
   engrenagem (Configurações do projeto) → aba "Geral" → seção
   "Seus apps" → app da Web → "Configuração do SDK" → objeto firebaseConfig.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDsRLvXKHAap4xXvlfJ6MF84Fv3T2lNjDw",
  authDomain: "dashboard-fuga-bar.firebaseapp.com",
  projectId: "dashboard-fuga-bar",
  storageBucket: "dashboard-fuga-bar.firebasestorage.app",
  messagingSenderId: "326249876681",
  appId: "1:326249876681:web:09d5b8c3491f75f36dd118"
};
/* ===================================================================== */

import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth, setPersistence, browserLocalPersistence,
  onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, onSnapshot,
  query, where, writeBatch
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const eventsCol = collection(db, "events");
const usersCol = collection(db, "users");

const loginGate = document.getElementById("loginGate");
const loginForm = document.getElementById("loginForm");
const loginEmail = document.getElementById("loginEmail");
const loginPassword = document.getElementById("loginPassword");
const loginError = document.getElementById("loginError");
const loginSubmit = document.getElementById("loginSubmit");
const loginLoading = document.getElementById("loginLoading");
const forgotBtn = document.getElementById("forgotPasswordBtn");
const logoutBar = document.getElementById("logoutBar");
const logoutBtn = document.getElementById("logoutBtn");
const noAccessBox = document.getElementById("noAccessBox");

function showLoginError(msg){
  loginError.textContent = msg;
  loginError.hidden = false;
}
function clearLoginError(){
  loginError.hidden = true;
  loginError.textContent = "";
}

const AUTH_ERROR_MESSAGES = {
  "auth/invalid-credential": "E-mail ou senha incorretos.",
  "auth/wrong-password": "E-mail ou senha incorretos.",
  "auth/user-not-found": "Não existe uma conta com esse e-mail. Peça para quem administra o painel te cadastrar.",
  "auth/invalid-email": "Digite um e-mail válido.",
  "auth/too-many-requests": "Muitas tentativas seguidas — aguarde alguns minutos e tente de novo.",
  "auth/user-disabled": "Essa conta foi desativada. Fale com quem administra o painel.",
  "auth/network-request-failed": "Falha de conexão. Verifique sua internet e tente de novo."
};

loginForm.addEventListener("submit", function(e){
  e.preventDefault();
  clearLoginError();
  loginSubmit.disabled = true;
  loginSubmit.textContent = "Entrando…";
  signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value)
    .catch(function(err){
      showLoginError(AUTH_ERROR_MESSAGES[err.code] || "Não foi possível entrar agora. Tente novamente.");
    })
    .finally(function(){
      loginSubmit.disabled = false;
      loginSubmit.textContent = "Entrar";
    });
});

forgotBtn.addEventListener("click", function(){
  clearLoginError();
  var email = (loginEmail.value || "").trim();
  if(!email){
    showLoginError("Digite seu e-mail no campo acima e clique em \"Esqueci minha senha\" de novo.");
    return;
  }
  forgotBtn.disabled = true;
  sendPasswordResetEmail(auth, email)
    .then(function(){
      showLoginError("Se esse e-mail estiver cadastrado, você vai receber um link para redefinir a senha.");
    })
    .catch(function(err){
      showLoginError(AUTH_ERROR_MESSAGES[err.code] || "Não foi possível enviar o e-mail agora. Tente novamente.");
    })
    .finally(function(){
      forgotBtn.disabled = false;
    });
});

logoutBtn.addEventListener("click", function(){
  signOut(auth).then(function(){ location.reload(); });
});

setPersistence(auth, browserLocalPersistence).catch(function(){});

var appStarted = false;
var unsubscribeSnapshot = null;

function eventDocData(d){
  var data = d.data();
  if(!data.id) data.id = d.id;
  return data;
}

function seedIfEmpty(){
  return getDocs(eventsCol).then(function(snap){
    if(!snap.empty) return;
    var seedEl = document.getElementById("seed-data");
    var initial;
    try{ initial = JSON.parse((seedEl && seedEl.textContent) || "{}"); }catch(e){ initial = {}; }
    var events = (initial && Array.isArray(initial.events)) ? initial.events : [];
    if(!events.length) return;
    var batch = writeBatch(db);
    events.forEach(function(ev){ batch.set(doc(db,"events",ev.id), ev); });
    return batch.commit();
  });
}

function handleSnapshotError(err){
  if(loginGate.hidden === false){
    showLoginError("Não foi possível carregar os dados (" + (err && err.code || "erro") + ").");
    loginLoading.hidden = true;
  }
}

function startAsAdmin(){
  window.__fugaRole = "admin";
  window.__fugaProfile = null;
  seedIfEmpty().catch(function(){}).then(function(){
    unsubscribeSnapshot = onSnapshot(eventsCol, function(snap){
      var events = snap.docs.map(eventDocData);
      if(!appStarted){
        window.__initialFugaState = { events: events };
        appStarted = true;
        loginGate.hidden = true;
        window.__startFugaApp();
      }else if(window.__fugaApplyRemote){
        window.__fugaApplyRemote({ events: events });
      }
    }, handleSnapshotError);
  });
}

function profileEventIds(profile){
  if(!profile) return [];
  if(Array.isArray(profile.eventIds) && profile.eventIds.length) return profile.eventIds;
  if(profile.eventId) return [profile.eventId];
  return [];
}

function startAsPartner(profile){
  window.__fugaRole = "partner";
  window.__fugaProfile = profile;
  var ids = profileEventIds(profile);
  var eventsMap = {};
  var unsubs = [];
  function pushUpdate(){
    var events = ids.map(function(id){ return eventsMap[id]; }).filter(function(e){ return !!e; });
    if(!appStarted){
      window.__initialFugaState = { events: events };
      appStarted = true;
      loginGate.hidden = true;
      window.__startFugaApp();
    }else if(window.__fugaApplyRemote){
      window.__fugaApplyRemote({ events: events });
    }
  }
  if(!ids.length){
    pushUpdate();
    unsubscribeSnapshot = function(){};
    return;
  }
  ids.forEach(function(id){
    var unsub = onSnapshot(doc(db, "events", id), function(snap){
      if(snap.exists()){ eventsMap[id] = eventDocData(snap); } else { delete eventsMap[id]; }
      pushUpdate();
    }, handleSnapshotError);
    unsubs.push(unsub);
  });
  unsubscribeSnapshot = function(){ unsubs.forEach(function(u){ u(); }); };
}

function showNoAccess(){
  loginForm.hidden = true;
  forgotBtn.hidden = true;
  loginLoading.hidden = true;
  noAccessBox.hidden = false;
}

onAuthStateChanged(auth, function(user){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  appStarted = false;
  if(!user){
    logoutBar.hidden = true;
    loginGate.hidden = false;
    loginLoading.hidden = true;
    loginForm.hidden = false;
    forgotBtn.hidden = false;
    noAccessBox.hidden = true;
    return;
  }
  logoutBar.hidden = false;
  loginForm.hidden = true;
  forgotBtn.hidden = true;
  noAccessBox.hidden = true;
  loginLoading.hidden = false;

  getDoc(doc(db, "users", user.uid)).then(function(profSnap){
    var profile = profSnap.exists() ? profSnap.data() : null;
    var valid = profile && (profile.role === "admin" || (profile.role === "partner" && profileEventIds(profile).length > 0));
    if(!valid){
      showNoAccess();
      return;
    }
    if(profile.role === "admin"){
      startAsAdmin();
    }else{
      startAsPartner(profile);
    }
  }).catch(function(err){
    showLoginError("Não foi possível verificar seu acesso (" + (err && err.code || "erro") + ").");
    loginLoading.hidden = true;
  });
});

window.__fugaSave = function(newState, oldState){
  var oldMap = {}, newMap = {};
  ((oldState && oldState.events) || []).forEach(function(e){ oldMap[e.id] = e; });
  ((newState && newState.events) || []).forEach(function(e){ newMap[e.id] = e; });
  var batch = writeBatch(db);
  var hasOps = false;
  Object.keys(newMap).forEach(function(id){
    if(JSON.stringify(newMap[id]) !== JSON.stringify(oldMap[id])){
      batch.set(doc(db,"events",id), newMap[id]);
      hasOps = true;
    }
  });
  Object.keys(oldMap).forEach(function(id){
    if(!newMap[id]){
      batch.delete(doc(db,"events",id));
      hasOps = true;
    }
  });
  if(!hasOps) return Promise.resolve();
  return batch.commit();
};

/* ---------- gestão de acessos de parceiros (só quem for admin) ---------- */
window.__fugaListPartners = function(){
  return getDocs(query(usersCol, where("role","==","partner"))).then(function(snap){
    return snap.docs.map(function(d){ return Object.assign({uid:d.id}, d.data()); });
  });
};

window.__fugaCreatePartner = function(email, senha, eventId){
  var secondaryApp = initializeApp(firebaseConfig, "partner-creator-" + Date.now());
  var secondaryAuth = getAuth(secondaryApp);
  return createUserWithEmailAndPassword(secondaryAuth, email, senha)
    .then(function(cred){
      var newUid = cred.user.uid;
      return signOut(secondaryAuth).then(function(){
        return setDoc(doc(db, "users", newUid), { role: "partner", eventIds: [eventId], email: email });
      });
    })
    .finally(function(){
      return deleteApp(secondaryApp).catch(function(){});
    });
};

window.__fugaAddPartnerEvent = function(uid, eventId){
  var ref = doc(db, "users", uid);
  return getDoc(ref).then(function(snap){
    var data = snap.exists() ? snap.data() : {};
    var base = profileEventIds(data);
    if(base.indexOf(eventId) === -1) base = base.concat([eventId]);
    return setDoc(ref, { eventIds: base }, { merge: true });
  });
};

window.__fugaRemovePartnerEvent = function(uid, eventId){
  var ref = doc(db, "users", uid);
  return getDoc(ref).then(function(snap){
    var data = snap.exists() ? snap.data() : {};
    var base = profileEventIds(data).filter(function(id){ return id !== eventId; });
    return setDoc(ref, { eventIds: base }, { merge: true });
  });
};

window.__fugaRevokePartner = function(uid){
  return deleteDoc(doc(db, "users", uid));
};
</script>
